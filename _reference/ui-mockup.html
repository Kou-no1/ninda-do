<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>忍打道 —NINDA DO— UI Mockup</title>
<link rel="stylesheet" href="../style.css">
<style>
.mockup{width:min(1100px,calc(100% - 32px));margin:auto;display:grid;gap:36px;padding:24px 0}
.mockup>section{border-bottom:1px solid var(--line);padding-bottom:28px}
.mockup .map-path{padding-top:45px}.mockup .map-path::before{top:20px}
.mockup .prompt-kana{font-size:56px}.mockup .dojo{min-height:auto}
.mockup .license-card{max-width:700px}.mockup h1{font-size:26px}
</style>
<main class="mockup">
  <section><header class="topbar"><h1>忍打道 —NINDA DO—</h1><span>里</span></header>
    <div class="map-section"><h3>入門の巻</h3><div class="map-path cols-4"><div class="map-node"><span class="node-icon" data-icon="torii"></span><b>入門・壱</b></div><div class="map-node"><span class="node-icon" data-icon="torii"></span><b>入門・弐</b></div></div></div>
    <div class="map-section"><h3>型の修行</h3><div class="map-path cols-4"><div class="map-node current"><span class="node-icon" data-icon="lantern"></span><b>4きゅう</b></div><div class="map-node"><span class="node-icon" data-icon="torii"></span><b>3きゅう</b></div></div></div>
  </section>
  <section><header class="play-header"><h1>4きゅう 修行</h1><div class="stat-line">気配:[静] 正確率:96%</div></header><div class="dojo"><div class="prompt-kana"><span class="prompt-unit current">や</span> ま</div><div class="romaji-guide"><span class="typed">y</span><span class="rest">ama</span></div><div id="mockGuide" class="guide-area"></div></div></section>
  <section><header class="play-header"><h1>1きゅう 心眼の試し</h1><div class="stat-line">気配:[不動] 正確率:98%</div></header><div class="dojo"><div class="prompt-kana" style="--prompt-size:30px">さとのみちを、しずかにあるく。</div><p class="progress-line">●●○（2 / 3）</p></div></section>
  <section><h1>免状</h1><div class="license-card"><h2>しのびまる</h2><dl class="license-list"><dt>二つ名</dt><dd>静寂の指</dd><dt>段位</dt><dd>4きゅう</dd><dt>累計正打</dt><dd>1,240</dd><dt>最高気配</dt><dd>不動</dd><dt>最大連撃</dt><dd>64</dd></dl></div></section>
</main>
<script src="../data/finger-data.js"></script>
<script src="../js/svg-icons.js"></script>
<script src="../js/guide-renderer.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(function (el) { el.innerHTML = SVG_ICONS[el.dataset.icon](); });
GuideRenderer.render(document.getElementById('mockGuide'), {guideLevel:2, expectedKeys:['a']});
</script>
</html>
